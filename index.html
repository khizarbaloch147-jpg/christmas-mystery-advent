<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Case of the Missing Christmas Star</title>
<meta name="description" content="24 days. 24 clues. One Christmas thief. An offline Christmas mystery for one screen.">
<style>
  :root {
    --green: #143026;
    --green-deep: #0c1c16;
    --pine: #214536;
    --red: #8d2c38;
    --red-deep: #6d2029;
    --gold: #d4b56a;
    --gold-deep: #a6853e;
    --cream: #f6f1e6;
    --cream-dim: #e6dccb;
    --ink: #241c16;
    --muted: #5e5348;
    --line: rgba(36, 28, 22, 0.14);
    --serif: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--cream);
    background:
      radial-gradient(900px 420px at 12% -10%, rgba(212, 181, 106, 0.16), transparent 55%),
      radial-gradient(700px 380px at 110% 0%, rgba(141, 44, 56, 0.2), transparent 50%),
      var(--green-deep);
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .skip {
    position: absolute;
    left: 12px;
    top: -40px;
    background: var(--cream);
    color: var(--ink);
    padding: 8px 12px;
    z-index: 5;
  }
  .skip:focus { top: 12px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
  header.bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    margin-bottom: 18px;
  }
  header.bar .brand { margin-right: auto; }
  .brand strong { display: block; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
  .year {
    margin: 0;
    color: var(--gold);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.82rem;
  }
  .bar nav { display: flex; flex-wrap: wrap; gap: 8px; }
  .ghost, .solid, .choice, .digit, .key, .spot, .card-btn, .door {
    border: 1px solid transparent;
    border-radius: 12px;
    min-height: 44px;
  }
  .ghost {
    background: transparent;
    color: var(--cream);
    border-color: rgba(246, 241, 230, 0.35);
    padding: 8px 12px;
  }
  .ghost[aria-pressed="true"], .choice[aria-pressed="true"] {
    border-color: var(--gold);
    box-shadow: inset 0 0 0 1px var(--gold);
  }
  .solid {
    background: var(--red);
    color: var(--cream);
    padding: 12px 16px;
    font-weight: 650;
  }
  .solid:hover { background: var(--red-deep); }
  .paper {
    background: var(--cream);
    color: var(--ink);
    border-radius: 18px;
    padding: 22px 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0 0 10px; }
  h1 { font-size: clamp(1.8rem, 4vw, 3rem); }
  h2 { font-size: clamp(1.4rem, 3vw, 2rem); }
  .kicker { margin: 0 0 8px; color: var(--gold-deep); letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.82rem; }
  .story { font-family: var(--serif); font-size: 1.25rem; line-height: 1.45; margin: 0 0 16px; }
  .lede { font-size: 1.15rem; max-width: 42rem; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .mode {
    text-align: left;
    background: #fffdf8;
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    min-height: 44px;
  }
  .mode[aria-pressed="true"] { border-color: var(--red); background: #fff7f4; }
  .mode strong { display: block; font-family: var(--serif); font-size: 1.2rem; }
  .progress { margin: 14px 0 0; color: var(--gold); }
  .paper .progress { color: var(--red-deep); }
  .paper .ghost, dialog .ghost { color: var(--ink); border-color: #c9bba6; }
  .doors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  .door {
    aspect-ratio: 1;
    background: linear-gradient(180deg, #2c4a3c, #1a3329);
    color: var(--gold);
    border: 1px solid rgba(212, 181, 106, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px;
  }
  .door .num { font-family: var(--serif); font-size: clamp(1.4rem, 3vw, 2rem); }
  .door .state { font-size: 0.75rem; color: var(--cream); }
  .door.ready { box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(212, 181, 106, 0.45); color: var(--cream); }
  .door.solved { background: var(--cream); color: var(--ink); }
  .door.solved .state { color: var(--pine); }
  .door.locked { opacity: 0.72; }
  .window-frame {
    border: 10px solid #6d4c33;
    border-radius: 18px 18px 8px 8px;
    padding: 14px;
    background:
      linear-gradient(#d7e4ee, #efe6d4 42%, #d9c8a4);
    margin-bottom: 14px;
  }
  .snow {
    height: 36px;
    background-image: radial-gradient(circle, #fff 1.2px, transparent 1.4px);
    background-size: 28px 18px;
    opacity: 0.8;
  }
  .puzzle { margin-top: 8px; }
  .letters { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .chip {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-width: 36px;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 1.2rem;
  }
  label { display: block; margin: 8px 0 4px; font-weight: 650; }
  input[type="text"], textarea {
    width: 100%;
    max-width: 36rem;
    background: #fff;
    color: var(--ink);
    border: 1px solid #c9bba6;
    border-radius: 10px;
    padding: 12px;
    font-size: 1.05rem;
  }
  textarea { min-height: 5rem; max-width: 100%; }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--line);
    padding: 12px 14px;
    margin: 8px 0;
  }
  .lockrow, .keys { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .digit {
    width: 64px;
    height: 64px;
    text-align: center;
    font-size: 1.6rem;
    background: #fff;
    color: var(--ink);
    border: 2px solid #c9bba6;
    border-radius: 12px;
  }
  .key {
    min-width: 52px;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 10px 12px;
  }
  .card-pool, .slots { display: grid; gap: 8px; margin: 8px 0 12px; }
  .card-btn {
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--line);
    padding: 12px;
  }
  .card-btn small { display: block; color: var(--muted); }
  .in-place { border-color: #2f6b4f; }
  .out { border-color: var(--red); }
  .scene {
    position: relative;
    width: min(100%, 680px);
    margin: 8px auto 12px;
    border-radius: 16px;
    overflow: hidden;
    background: #d5e2ea;
  }
  .scene svg { width: 100%; height: auto; display: block; }
  .spot {
    position: absolute;
    min-width: 48px;
    min-height: 48px;
    transform: translate(-50%, -50%);
    background: rgba(255, 253, 248, 0.88);
    color: var(--ink);
    border: 2px solid #6d4c33;
    border-radius: 999px;
    padding: 8px 10px;
    font-size: 0.85rem;
  }
  .spot.glow { box-shadow: 0 0 0 4px var(--gold), 0 0 18px var(--gold); }
  .msg { min-height: 1.4em; font-weight: 650; }
  .msg.bad { color: var(--red-deep); }
  .msg.good { color: #21543c; }
  .stamp {
    display: inline-block;
    border: 3px solid var(--red);
    color: var(--red);
    font-family: var(--serif);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
    transform: rotate(-6deg);
    margin-bottom: 8px;
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .suspect, .clue, .when {
    background: #fffdf8;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    margin: 8px 0;
  }
  .suspect h3 { margin-bottom: 4px; }
  .muted { color: var(--muted); }
  dialog {
    border: none;
    border-radius: 16px;
    padding: 0;
    max-width: 28rem;
    width: calc(100% - 24px);
    color: var(--ink);
    background: var(--cream);
  }
  dialog::backdrop { background: rgba(8, 16, 12, 0.62); }
  dialog .inner { padding: 18px; }
  .nudge { animation: nudge 0.28s ease; }
  @keyframes nudge {
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  @media (max-width: 800px) {
    .doors { grid-template-columns: repeat(4, 1fr); }
    .modes { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .story { font-size: 1.15rem; }
    .digit { width: 52px; height: 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nudge { animation: none; }
    .snow { display: none; }
  }
</style>
</head>

  function defaultState() {
    return { v: 1, mode: "advent", sound: true, solved: {}, hints: {}, startedAt: null, finishedAt: null };
  }

  var state = load();
  var modal = null;
  var session = blankSession(0);
  var audioCtx = null;

  function blankSession(n) {
    return {
      n: n, typed: "", digits: ["", "", "", ""], shift: 0, picked: null,
      placed: [], marks: null, message: "", tone: "", glow: false, timer: 0,
      who: "", why: "", where: ""
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return defaultState();
      var data = JSON.parse(raw);
      if (!data || data.v !== 1) return defaultState();
      data.solved = data.solved || {};
      data.hints = data.hints || {};
      if (data.mode !== "binge") data.mode = "advent";
      data.sound = data.sound !== false;
      return data;
    } catch (err) {
      return defaultState();
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (err) { /* private mode */ }
  }

  function norm(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().replace(/\s+/g, " ");
  }
  function compact(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }
  function sameText(input, answer, also) {
    var n = norm(input);
    var c = compact(input);
    if (!n) return false;
    var list = [answer].concat(also || []);
    for (var i = 0; i < list.length; i++) {
      if (n === norm(list[i]) || c === compact(list[i])) return true;
    }
    return false;
  }
  function caesarDecode(text, shift) {
    return String(text).replace(/[A-Za-z]/g, function (ch) {
      var up = ch.toUpperCase().charCodeAt(0) - 65;
      return String.fromCharCode(((up - shift + 26) % 26) + 65);
    });
  }
  function atbash(text) {
    return String(text).replace(/[A-Za-z]/g, function (ch) {
      var up = ch.toUpperCase().charCodeAt(0) - 65;
      return String.fromCharCode(65 + (25 - up));
    });
  }
  function dayBy(n) {
    for (var i = 0; i < DAYS.length; i++) if (DAYS[i].n === n) return DAYS[i];
    return null;
  }
  function solvedCount() {
    return Object.keys(state.solved).length;
  }
  function highestSolved() {
    var nums = Object.keys(state.solved).map(Number);
    return nums.length ? Math.max.apply(null, nums) : 0;
  }
  function bingeLimit() {
    return Math.max(1, highestSolved() + 1);
  }
  function dateAllows(n, date) {
    if (date.getMonth() !== 11) return false;
    var day = date.getDate();
    if (day > 24) return true;
    return day >= n;
  }
  function isUnlocked(n, date) {
    if (state.solved[String(n)]) return true;
    if (state.mode === "binge") return n <= bingeLimit();
    return dateAllows(n, date || new Date());
  }
  function currentDoor(date) {
    date = date || new Date();
    for (var n = 1; n <= 24; n++) {
      if (!state.solved[String(n)] && isUnlocked(n, date)) return n;
    }
    return solvedCount() === 24 ? 24 : 0;
  }
  function monthName(n) {
    return n + " December";
  }

  function h(tag, attrs, kids) {
    var node = document.createElement(tag);
    var a = attrs || {};
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (v == null || v === false) return;
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : String(v));
    });
    var list = [].concat(kids || []);
    list.forEach(function (kid) {
      if (kid == null || kid === false) return;
      node.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    });
    return node;
  }

  function tone(freq, dur, when, gain) {
    if (!state.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var t = audioCtx.currentTime + (when || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.05, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    } catch (err) { /* autoplay or missing audio */ }
  }
  function chimeOk() { tone(523, 0.16, 0, 0.05); tone(659, 0.2, 0.09, 0.05); tone(784, 0.26, 0.18, 0.04); }
  function chimeBad() { tone(180, 0.14, 0, 0.04); }
  function chimeWin() { tone(523, 0.18, 0, 0.05); tone(659, 0.18, 0.12, 0.05); tone(784, 0.22, 0.24, 0.05); tone(1047, 0.36, 0.36, 0.04); }

  function markHint(n) {
    var k = String(n);
    if (!state.hints[k]) {
      state.hints[k] = true;
      save();
    }
  }
  function solve(n) {
    var k = String(n);
    if (!state.solved[k]) {
      if (!state.startedAt) state.startedAt = new Date().toISOString();
      state.solved[k] = { at: new Date().toISOString() };
      if (n === 24) state.finishedAt = new Date().toISOString();
      save();
    }
  }
  function localDate(iso) {
    var d = new Date(iso);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function daysTaken() {
    if (!state.startedAt || !state.finishedAt) return solvedCount() ? 1 : 0;
    var a = localDate(state.startedAt);
    var b = localDate(state.finishedAt);
    return Math.round((b - a) / 86400000) + 1;
  }

  function collected() {
    var intro = {};
    var fields = {};
    SUSPECTS.forEach(function (s) {
      fields[s.id] = { motive: [], alibi: [], secret: [], note: [] };
    });
    var timeline = [];
    var evidence = [];
    DAYS.forEach(function (day) {
      if (!state.solved[String(day.n)]) return;
      evidence.push({ n: day.n, title: day.title, text: day.evidence });
      var notes = day.notes || {};
      (notes.intro || []).forEach(function (id) { intro[id] = true; });
      var patch = notes.fields || {};
      Object.keys(patch).forEach(function (id) {
        ["motive", "alibi", "secret", "note"].forEach(function (key) {
          if (patch[id][key]) fields[id][key].push(patch[id][key]);
        });
      });
      (notes.timeline || []).forEach(function (item) { timeline.push(item); });
    });
    timeline.sort(function (a, b) { return a.sort - b.sort; });
    return { intro: intro, fields: fields, timeline: timeline, evidence: evidence };
  }

  function grade(day, input) {
    var p = day.puzzle;
    if (day.type === "scramble" || day.type === "cipher") return sameText(input, p.answer, p.also);
    if (day.type === "lock") return String(input) === p.code;
    if (day.type === "logic") return input === p.answer;
    if (day.type === "hidden") return input === p.target;
    if (day.type === "timeline") return Array.isArray(input) && input.join(",") === p.answer.join(",");
    return false;
  }

  function header() {
    return h("header", { class: "bar" }, [
      h("div", { class: "brand" }, [
        h("strong", {}, "The Case of the Missing Christmas Star"),
        h("p", { class: "year" }, "Christmas 2026")
      ]),
      h("nav", { "aria-label": "Game" }, [
        h("button", { class: "ghost", type: "button", onclick: function () { go("home"); } }, "Home"),
        h("button", { class: "ghost", type: "button", onclick: function () { go("calendar"); } }, "Calendar"),
        h("button", { class: "ghost", type: "button", onclick: function () { go("notebook"); } }, "Notebook"),
        h("button", { class: "ghost", type: "button", onclick: openSettings }, "Settings")
      ])
    ]);
  }

  function openSettings() { modal = "settings"; render(); }
  function askReset() { modal = "reset"; render(); }

  function go(name, n) {
    if (session.timer) { clearTimeout(session.timer); session.timer = 0; }
    modal = null;
    var hash = name === "day" ? "#day/" + n : "#" + name;
    if (location.hash !== hash) location.hash = hash;
    else render();
  }

  function viewFromHash() {
    var raw = (location.hash || "#home").replace(/^#/, "");
    if (raw === "selftest") return { name: "home" };
    var bits = raw.split("/");
    if (bits[0] === "day") return { name: "day", n: Number(bits[1]) };
    if (bits[0] === "calendar" || bits[0] === "notebook" || bits[0] === "solved") return { name: bits[0] };
    return { name: "home" };
  }

  function render() {
    var view = viewFromHash();
    var app = document.getElementById("app");
    app.replaceChildren();
    var main = h("main", { id: "main", class: "wrap" });
    main.appendChild(header());
    if (view.name === "home") main.appendChild(screenHome());
    else if (view.name === "calendar") main.appendChild(screenCalendar());
    else if (view.name === "notebook") main.appendChild(screenNotebook());
    else if (view.name === "solved") main.appendChild(screenSolved());
    else if (view.name === "day") main.appendChild(screenDay(view.n));
    app.appendChild(main);
    if (modal) {
      var dlg = screenModal();
      app.appendChild(dlg);
      try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
    }
    var focus = main.querySelector("[data-autofocus]") || main.querySelector("h1");
    if (focus && focus.focus) focus.focus();
  }

  function screenHome() {
    var now = new Date();
    var before = now.getMonth() !== 11;
    var box = h("section", { class: "paper" });
    box.appendChild(h("p", { class: "kicker" }, "A 24-day mystery"));
    box.appendChild(h("h1", {}, "The Case of the Missing Christmas Star"));
    box.appendChild(h("p", { class: "lede" }, "24 days. 24 clues. One Christmas thief."));
    box.appendChild(h("p", { class: "story" }, "Open one door, solve one puzzle, and keep every clue in the notebook. On the last door, name who took the star, why, and where it is hidden."));
    box.appendChild(h("p", {}, "This is Christmas 2026. The star first topped the Harrington tree fifty years ago."));
    if (before && state.mode === "advent") {
      box.appendChild(h("p", {}, "It is not December yet. Advent doors stay shut until their December dates. Binge mode plays the whole case today."));
    }
    if (now.getMonth() === 11 && now.getDate() > 24) {
      box.appendChild(h("p", {}, "December 24 has passed. In Advent mode every door is open."));
    }
    var modes = h("div", { class: "modes", role: "group", "aria-label": "Play mode" });
    modes.appendChild(modeButton("advent", "Advent", "Door 1 opens on 1 December, door 2 on 2 December, and so on."));
    modes.appendChild(modeButton("binge", "Binge", "The next door opens as soon as you solve the one you are on. No dates."));
    box.appendChild(modes);
    box.appendChild(h("p", { class: "progress" }, progressLine()));
    var row = h("div", { class: "row" });
    if (solvedCount() || state.finishedAt) {
      row.appendChild(h("button", { class: "solid", type: "button", onclick: continueCase }, state.finishedAt ? "Read the ending" : "Continue"));
    }
    row.appendChild(h("button", { class: "solid", type: "button", onclick: function () { go("calendar"); } }, "Open the calendar"));
    row.appendChild(h("button", { class: "ghost", type: "button", style: "color:#241c16;border-color:#c9bba6", onclick: function () { go("notebook"); } }, "Notebook"));

    return box;
  }

  function modeButton(id, title, text) {
    return h("button", {
      class: "mode", type: "button", "aria-pressed": state.mode === id ? "true" : "false",
      onclick: function () { state.mode = id; save(); render(); }
    }, [h("strong", {}, title), text]);
  }

  function continueCase() {
    if (state.finishedAt) { go("solved"); return; }
    var n = currentDoor(new Date());
    if (n) go("day", n);
    else go("calendar");
  }

  function progressLine() {
    var n = currentDoor(new Date());
    var door = n || Math.min(24, Math.max(1, highestSolved()));
    return "Door " + door + " of 24 — " + solvedCount() + (solvedCount() === 1 ? " clue found" : " clues found");
  }

  function screenCalendar() {
    var now = new Date();
    var box = h("section", {});
    var frame = h("div", { class: "window-frame", "aria-hidden": "true" });
    frame.appendChild(h("div", { class: "snow" }));
    frame.appendChild(h("p", { style: "margin:8px 0 0;color:#241c16;font-family:Palatino,Georgia,serif;font-size:1.4rem" }, "The Harrington house"));
    box.appendChild(frame);
    box.appendChild(h("h1", {}, "Twenty-four doors"));
    box.appendChild(h("p", { class: "progress" }, progressLine()));
    if (state.mode === "advent" && now.getMonth() !== 11) {
      box.appendChild(h("p", {}, "Advent mode is waiting for December. Switch to Binge on the home screen to play today."));
    }

    var current = currentDoor(now);
    for (var n = 1; n <= 24; n++) grid.appendChild(doorButton(n, now, current));

  }

  function doorButton(n, now, current) {
    var open = isUnlocked(n, now);
    var solved = !!state.solved[String(n)];
    var cls = "door" + (solved ? " solved" : open ? " ready" : " locked");
    if (!solved && open && n === current) cls += " ready";
    var stateText = solved ? "Solved" : open ? "Open" : "Locked";
    var extra = "";
    var ariaExtra = "";
    if (!open) {
      if (state.mode === "binge") ariaExtra = "Solve the open door first";
      else { extra = n + " Dec"; ariaExtra = "Opens " + monthName(n); }
    }
    return h("button", {
      class: cls, type: "button",
      "aria-label": "Door " + n + ", " + stateText + (ariaExtra ? ", " + ariaExtra : ""),
      onclick: function () { go("day", n); }
    }, [
      h("span", { class: "num" }, String(n)),
      h("span", { class: "state" }, solved ? "Solved" : open ? "Open" : "Locked"),
      extra ? h("span", { class: "state" }, extra) : null
    ]);
  }

  function screenDay(n) {
    var day = dayBy(n);
    var box = h("article", { class: "paper" });
    if (!day) {
      box.appendChild(h("h1", {}, "That door is not on this calendar"));
      box.appendChild(h("button", { class: "solid", type: "button", onclick: function () { go("calendar"); } }, "Back to the calendar"));
      return box;
    }
    var open = isUnlocked(n, new Date());
    box.appendChild(h("p", { class: "kicker" }, "Door " + n + " of 24"));
    if (!open) {
      box.appendChild(h("h1", {}, "This door is shut"));
      var why = state.mode === "binge"
        ? "Solve the open door first. The next one unlocks when that puzzle is done."
        : "This door opens on " + monthName(n) + ". Binge mode on the home screen plays ahead of the dates.";
      box.appendChild(h("p", { class: "story" }, why));
      box.appendChild(h("button", { class: "solid", type: "button", onclick: function () { go("calendar"); } }, "Back to the calendar"));
      return box;
    }
    box.appendChild(h("h1", {}, day.title));
    if (session.n !== n) session = blankSession(n);
    box.appendChild(h("p", { class: "story" }, day.story));
    if (state.solved[String(n)]) {
      var fresh = !!session.just;
      session.just = false;
      box.appendChild(foundBlock(day, fresh));
      return box;
    }
    box.appendChild(puzzleBlock(day));
    return box;
  }

  function foundBlock(day, justNow) {
    var wrap = h("div", {});
    if (justNow) wrap.appendChild(h("p", { class: "stamp" }, "Clue found"));
    wrap.appendChild(h("h2", {}, "Evidence"));
    wrap.appendChild(h("p", { class: "story" }, day.evidence));
    if (day.n === 16) wrap.appendChild(h("p", {}, "Inside the box: wrapping paper, and a note that reads “Merry Christmas — B”."));
    var row = h("div", { class: "row" });
    row.appendChild(h("button", { class: "solid", type: "button", onclick: function () { go("notebook"); } }, "Open the notebook"));
    row.appendChild(h("button", { class: "ghost", type: "button", style: "color:#241c16;border-color:#c9bba6", onclick: function () { go("calendar"); } }, "Back to the calendar"));
    if (day.n < 24 && isUnlocked(day.n + 1, new Date())) {
      row.appendChild(h("button", { class: "solid", type: "button", onclick: function () { go("day", day.n + 1); } }, "Open door " + (day.n + 1)));
    }
    if (day.n === 24) {
      row.appendChild(h("button", { class: "solid", type: "button", onclick: function () { go("solved"); } }, "See the ending"));
    }
    wrap.appendChild(row);

  function puzzleBlock(day) {
    var wrap = h("div", { class: "puzzle" });
    if (day.type === "scramble") wrap.appendChild(scrambleUI(day));
    else if (day.type === "cipher") wrap.appendChild(cipherUI(day));
    else if (day.type === "lock") wrap.appendChild(lockUI(day));
    else if (day.type === "logic") wrap.appendChild(logicUI(day));
    else if (day.type === "hidden") wrap.appendChild(hiddenUI(day));
    else if (day.type === "timeline") wrap.appendChild(timelineUI(day));
    else wrap.appendChild(finalUI(day));
    var msg = h("p", { class: "msg" + (session.tone ? " " + session.tone : ""), "aria-live": "polite" }, session.message || "");
    wrap.appendChild(msg);
    if (!state.hints[String(day.n)]) {
      wrap.appendChild(h("button", { class: "ghost", type: "button", style: "color:#241c16;border-color:#c9bba6;margin-top:8px", onclick: function () { useHint(day); } }, "Hint"));
    } else {
      wrap.appendChild(h("p", {}, "Hint: " + day.hint));
    }
    return wrap;
  }

  function useHint(day) {
    markHint(day.n);
    session.message = day.hint;
    session.tone = "";
    if (day.type === "hidden") session.glow = true;
    render();
  }

  function succeed(day) {
    if (session.timer) { clearTimeout(session.timer); session.timer = 0; }
    solve(day.n);
    session.just = true;
    session.message = "";
    if (day.n === 24) chimeWin();
    else chimeOk();
    if (day.n === 24) go("solved");
    else render();
  }

  function fail(text) {
    chimeBad();
    session.message = text;
    session.tone = "bad";
    render();
    var node = document.querySelector(".puzzle");
    if (node) {
      node.classList.add("nudge");
      node.addEventListener("animationend", function () { node.classList.remove("nudge"); }, { once: true });

        go("home");
      } }, "Clear the case"));
      row.appendChild(h("button", { class: "ghost", type: "button", style: "color:#241c16;border-color:#c9bba6", onclick: function () { modal = null; render(); } }, "Keep playing"));
      inner.appendChild(row);
    } else {
      inner.appendChild(h("h2", {}, "Settings"));
      inner.appendChild(h("p", {}, "Sound is " + (state.sound ? "on" : "off") + "."));
      inner.appendChild(h("button", { class: "solid", type: "button", onclick: function () { state.sound = !state.sound; save(); render(); } }, state.sound ? "Mute sound" : "Turn sound on"));
      inner.appendChild(h("p", {}, "Mode is " + (state.mode === "binge" ? "Binge" : "Advent") + ". Switching to Advent closes doors whose December date has not arrived, except doors you have already solved."));
      var row2 = h("div", { class: "row" });
      row2.appendChild(h("button", { class: "ghost", type: "button", style: "color:#241c16;border-color:#c9bba6", onclick: function () { state.mode = "advent"; save(); modal = null; render(); } }, "Advent mode"));
      row2.appendChild(h("button", { class: "ghost", type: "button", style: "color:#241c16;border-color:#c9bba6", onclick: function () { state.mode = "binge"; save(); modal = null; render(); } }, "Binge mode"));
      inner.appendChild(row2);
      inner.appendChild(h("div", { class: "row" }, [
        h("button", { class: "solid", type: "button", onclick: askReset }, "Reset progress"),
        h("button", { class: "ghost", type: "button", style: "color:#241c16;border-color:#c9bba6", onclick: function () { modal = null; render(); } }, "Close")
      ]));
    }
    dlg.appendChild(inner);
    dlg.addEventListener("cancel", function (e) { e.preventDefault(); if (modal !== "reset") { modal = null; render(); } });
    return dlg;
  }

  function selfTest() {
    var lines = [];
    function ok(name, cond) { lines.push((cond ? "PASS " : "FAIL ") + name); }
    function bag(s) { return String(s).toUpperCase().replace(/[^A-Z]/g, "").split("").sort().join(""); }
    ok("24 days", DAYS.length === 24 && DAYS.every(function (d, i) { return d.n === i + 1; }));
    ok("caesar 4", caesarDecode(dayBy(4).puzzle.cipher, 3) === "THE STAR BELONGS IN A MUSEUM");
    ok("caesar 14", caesarDecode(dayBy(14).puzzle.cipher, 3) === "LOOK UNDER THE TREE");
    ok("atbash 8", atbash(dayBy(8).puzzle.cipher) === "HE OWES MONEY");
    ok("atbash 19", atbash(dayBy(19).puzzle.cipher) === "GOLD WATCH SOLD");
    [1, 6, 15, 22].forEach(function (n) {
      var d = dayBy(n);
      ok("scramble " + n, bag(d.puzzle.letters.join("")) === bag(d.puzzle.answer));
    });
    ok("lock 5", dayBy(5).puzzle.code === "1976");
    ok("lock 10", dayBy(10).puzzle.code === "2412");
    ok("lock 16", dayBy(16).puzzle.code === "2405");
    ok("logic answers", [3, 7, 12, 17, 21].every(function (n) {
      var d = dayBy(n);
      return d.puzzle.options.some(function (o) { return o.id === d.puzzle.answer; });
    }));
    ok("timelines", [2, 11, 20, 23].every(function (n) {
      var d = dayBy(n);
      return d.puzzle.answer.length === d.puzzle.cards.length;
    }));
    ok("grades", grade(dayBy(1), "STAR") && grade(dayBy(2), ["b", "d", "c", "a"]) && grade(dayBy(5), "1976") && !grade(dayBy(5), "1977"));
    DAYS.forEach(function (d) {
      if (d.type === "scramble" || d.type === "cipher" || d.type === "logic") ok("solve " + d.n, grade(d, d.puzzle.answer));
      else if (d.type === "lock") ok("solve " + d.n, grade(d, d.puzzle.code));
      else if (d.type === "hidden") ok("solve " + d.n, grade(d, d.puzzle.target));
      else if (d.type === "timeline") ok("solve " + d.n, grade(d, d.puzzle.answer.slice()));
      else ok("final door", d.n === 24);
    });
    var nov = new Date(2026, 10, 21);
    var dec1 = new Date(2026, 11, 1);
    var dec5 = new Date(2026, 11, 5);
    var dec26 = new Date(2026, 11, 26);
    var jan = new Date(2027, 0, 3);
    ok("nov locked", !dateAllows(1, nov));
    ok("dec 1", dateAllows(1, dec1) && !dateAllows(2, dec1));
    ok("dec 5", dateAllows(5, dec5) && !dateAllows(6, dec5));
    ok("after christmas", dateAllows(24, dec26) && dateAllows(1, dec26));
    ok("january", !dateAllows(1, jan));
    var prev = state;
    state = defaultState();
    state.mode = "binge";
    ok("binge door 1", isUnlocked(1, nov) && !isUnlocked(2, nov));
    state.solved["5"] = { at: "2026-11-21T00:00:00" };
    ok("binge after 5", isUnlocked(1, nov) && isUnlocked(6, nov) && !isUnlocked(7, nov));
    state.mode = "advent";
    ok("solved stays open", isUnlocked(5, nov));
    ok("advent relock", !isUnlocked(6, nov));
    state = prev;
    try {
      state = defaultState();
      state.mode = "binge";
      state.sound = false;
      save();
      DAYS.forEach(function (day) {
        session = blankSession(day.n);
        if (day.type === "scramble") { session.typed = day.puzzle.answer; checkScramble(day); }
        else if (day.type === "cipher") { session.typed = day.puzzle.answer; checkCipher(day); }
        else if (day.type === "lock") { session.digits = day.puzzle.code.split(""); checkLock(day); }
        else if (day.type === "logic") { session.picked = day.puzzle.answer; checkLogic(day); }
        else if (day.type === "hidden") pickHidden(day, day.puzzle.target);
        else if (day.type === "timeline") { session.placed = day.puzzle.answer.slice(); checkTimeline(day); }
        else { session.who = "bernard"; session.why = "debts"; session.where = "box"; checkFinal(day); }
      });
      ok("playthrough", solvedCount() === 24 && !!state.finishedAt);
      go("notebook");
      session.tab = "suspects";
      render();
      var book = document.body.textContent;
      ok("notebook has Bernard", book.indexOf("Bernard Harrington") !== -1 && book.indexOf("None for 8:15") !== -1);
      ok("notebook clears Margaret", book.indexOf("In the kitchen with Clara") !== -1);
    } catch (err) {
      ok("playthrough crashed " + (err && err.message), false);
    }
    state = defaultState();
    save();
    session = blankSession(0);
    modal = null;
    if (location.hash !== "#selftest") location.hash = "#selftest";
    var log = document.getElementById("testlog");
    log.hidden = false;
    log.textContent = lines.join("\n");
    log.style.whiteSpace = "pre-wrap";
    log.style.background = lines.some(function (l) { return l.indexOf("FAIL") === 0; }) ? "#8d2c38" : "#214536";
    log.style.padding = "12px";
  }

  window.addEventListener("hashchange", render);
  if (location.hash === "#selftest") selfTest();
  render();
})();
</script>
</body>
